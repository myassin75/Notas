name: Secret Scanning

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main]

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Verify No Tracked Service Account Keys
        run: |
          echo "Auditing tracked repository files for service account credentials..."
          FORBIDDEN=$(git ls-files | grep -iE "(adminsdk.*\.json|service-account.*\.json|notas-7db14.*\.json)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "FATAL: Compromised or service-account JSON files found in Git tracking:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Repository is clean of tracked service-account JSON keys."

